```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us | CakeHeaven</title>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}


html{
    scroll-behavior:smooth;
}


body{
    background:#fff0f5;
    color:#333;
    overflow-x:hidden;
}


/* =====================================================
   HEADER
===================================================== */

.header{

    position:fixed;

    width:100%;

    top:0;
    left:0;

    padding:18px 50px;

    background:rgba(255,255,255,0.97);

    backdrop-filter:blur(20px);

    display:flex;

    justify-content:space-between;

    align-items:center;

    box-shadow:0 2px 8px rgba(0,0,0,0.1);

    z-index:1000;

}


/* =====================================================
   LOGO
===================================================== */

.logo{

    font-size:28px;

    font-weight:bold;

    color:#ff3a6e;

    white-space:nowrap;

}


/* =====================================================
   DESKTOP NAVIGATION
===================================================== */

.nav{

    display:flex;

    gap:15px;

    align-items:center;

}


.nav a{

    text-decoration:none;

    font-weight:600;

    color:#333;

    transition:0.3s;

    padding:8px 15px;

    border-radius:25px;

}


.nav a:hover{

    background:#ff3a6e;

    color:#fff;

    transform:scale(1.05);

}


/* =====================================================
   HAMBURGER BUTTON
===================================================== */

.menu-btn{

    display:none;

    border:none;

    background:transparent;

    color:#ff3a6e;

    font-size:30px;

    cursor:pointer;

    line-height:1;

}


/* =====================================================
   HERO
===================================================== */

.hero{

    min-height:420px;

    background:
        linear-gradient(
            135deg,
            #ff96b8,
            #ffc3a0
        );

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:
        130px 20px 80px;

    color:white;

}


.hero h1{

    font-size:48px;

    line-height:1.2;

    margin-bottom:12px;

}


.hero p{

    font-size:20px;

    line-height:1.6;

    max-width:700px;

}


/* =====================================================
   CONTACT SECTION
===================================================== */

.contact-section{

    width:100%;

    max-width:1250px;

    margin:50px auto;

    padding:0 25px;

    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        minmax(0,1fr);

    gap:35px;

    align-items:stretch;

}


/* =====================================================
   LEFT IMAGE
===================================================== */

.contact-image{

    min-height:700px;

    background:
        url('https://www.mbbmanagement.com/wp-content/uploads/2017/03/bakery.jpg')
        no-repeat
        center/cover;

    border-radius:30px;

    position:relative;

    overflow:hidden;

    box-shadow:
        0 10px 25px rgba(255,58,110,0.15);

}


/* =====================================================
   IMAGE OVERLAY
===================================================== */

.contact-image::before{

    content:"";

    position:absolute;

    inset:0;

    background:
        radial-gradient(
            circle at 20% 30%,
            rgba(255,255,255,0.25) 0%,
            transparent 50%
        );

    animation:
        bubble 8s infinite linear;

}


@keyframes bubble{

    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-20px);
    }

    100%{
        transform:translateY(0);
    }

}


/* =====================================================
   RIGHT SIDE
===================================================== */

.contact-details{

    display:flex;

    flex-direction:column;

    gap:22px;

}


/* =====================================================
   INFO CARDS
===================================================== */

.info-card{

    background:#fff;

    padding:
        25px 22px;

    border-radius:25px;

    box-shadow:
        0 10px 25px rgba(255,58,110,0.15);

    display:flex;

    align-items:center;

    gap:18px;

    min-height:85px;

    transition:0.3s;

}


.info-card:hover{

    transform:translateY(-5px);

    box-shadow:
        0 14px 28px rgba(255,58,110,0.20);

}


.info-card span{

    font-size:28px;

    flex-shrink:0;

}


.info-card p{

    font-size:16px;

    line-height:1.5;

    word-break:break-word;

}


/* =====================================================
   CONTACT FORM
===================================================== */

.contact-form{

    background:#fff;

    padding:
        35px 30px;

    border-radius:30px;

    box-shadow:
        0 10px 25px rgba(255,58,110,0.15);

}


.contact-form h2{

    color:#ff3a6e;

    text-align:center;

    margin-bottom:25px;

    font-size:28px;

}


/* =====================================================
   FORM
===================================================== */

.contact-form form{

    display:flex;

    flex-direction:column;

    gap:17px;

}


.contact-form input,
.contact-form textarea{

    width:100%;

    padding:
        14px 18px;

    border-radius:15px;

    border:
        1px solid #ffafbd;

    font-size:16px;

    background:#fff;

    transition:0.3s;

}


.contact-form input:focus,
.contact-form textarea:focus{

    border-color:#ff3a6e;

    outline:none;

    box-shadow:
        0 0 10px rgba(255,58,110,0.2);

}


.contact-form textarea{

    resize:vertical;

    min-height:150px;

}


/* =====================================================
   BUTTON
===================================================== */

.contact-form button{

    background:
        linear-gradient(
            135deg,
            #ff96b8,
            #ff3a6e
        );

    color:#fff;

    border:none;

    padding:15px;

    border-radius:15px;

    font-size:18px;

    font-weight:600;

    cursor:pointer;

    transition:0.3s;

}


.contact-form button:hover{

    transform:translateY(-5px);

    box-shadow:
        0 8px 20px rgba(255,58,110,0.3);

}


/* =====================================================
   FOOTER
===================================================== */

footer{

    background:#ff3a6e;

    color:white;

    text-align:center;

    padding:20px;

    margin-top:50px;

}


footer p{

    font-size:15px;

}


/* =====================================================
   TABLET
===================================================== */

@media(max-width:1000px){

    .header{

        padding:
            18px 30px;

    }


    .nav{

        gap:5px;

    }


    .nav a{

        font-size:14px;

        padding:
            8px 10px;

    }


    .hero h1{

        font-size:40px;

    }


    .hero p{

        font-size:18px;

    }


    .contact-section{

        grid-template-columns:1fr;

        max-width:750px;

        margin:
            40px auto;

    }


    .contact-image{

        min-height:450px;

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){


    /* ---------------- HEADER ---------------- */

    .header{

        padding:
            15px 20px;

        min-height:65px;

    }


    .logo{

        font-size:23px;

    }


    /* ---------------- HAMBURGER ---------------- */

    .menu-btn{

        display:block;

    }


    /* ---------------- MOBILE NAV ---------------- */

    .nav{

        display:none;

        position:absolute;

        top:65px;

        left:0;

        width:100%;

        background:white;

        flex-direction:column;

        gap:0;

        padding:8px 0;

        box-shadow:
            0 8px 15px rgba(0,0,0,0.12);

    }


    .nav.active{

        display:flex;

    }


    .nav a{

        width:100%;

        text-align:center;

        padding:15px 20px;

        border-radius:0;

        font-size:16px;

        border-bottom:
            1px solid #f4dce4;

    }


    .nav a:last-child{

        border-bottom:none;

    }


    .nav a:hover{

        transform:none;

    }


    /* ---------------- HERO ---------------- */

    .hero{

        min-height:350px;

        padding:
            110px 20px 60px;

    }


    .hero h1{

        font-size:34px;

    }


    .hero p{

        font-size:16px;

        line-height:1.5;

    }


    /* ---------------- CONTACT ---------------- */

    .contact-section{

        display:flex;

        flex-direction:column;

        margin:
            30px auto;

        padding:
            0 15px;

        gap:25px;

    }


    /* ---------------- IMAGE ---------------- */

    .contact-image{

        width:100%;

        min-height:330px;

        height:330px;

        border-radius:22px;

    }


    /* ---------------- DETAILS ---------------- */

    .contact-details{

        width:100%;

        gap:18px;

    }


    /* ---------------- INFO CARDS ---------------- */

    .info-card{

        width:100%;

        min-height:75px;

        padding:
            20px 18px;

        border-radius:20px;

        gap:14px;

    }


    .info-card span{

        font-size:25px;

    }


    .info-card p{

        font-size:15px;

    }


    /* ---------------- FORM ---------------- */

    .contact-form{

        width:100%;

        padding:
            28px 20px;

        border-radius:22px;

    }


    .contact-form h2{

        font-size:25px;

        margin-bottom:22px;

    }


    .contact-form form{

        gap:14px;

    }


    .contact-form input,
    .contact-form textarea{

        font-size:15px;

        padding:
            13px 15px;

    }


    .contact-form textarea{

        min-height:130px;

    }


    .contact-form button{

        font-size:17px;

        padding:14px;

    }


    /* ---------------- FOOTER ---------------- */

    footer{

        margin-top:35px;

        padding:18px 15px;

    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:400px){


    .header{

        padding:
            14px 15px;

    }


    .logo{

        font-size:20px;

    }


    .menu-btn{

        font-size:27px;

    }


    .nav{

        top:60px;

    }


    .hero{

        min-height:320px;

        padding:
            100px 15px 55px;

    }


    .hero h1{

        font-size:29px;

    }


    .hero p{

        font-size:14px;

    }


    .contact-section{

        padding:
            0 12px;

    }


    .contact-image{

        height:280px;

        min-height:280px;

        border-radius:18px;

    }


    .info-card{

        padding:
            17px 15px;

    }


    .info-card span{

        font-size:23px;

    }


    .info-card p{

        font-size:14px;

    }


    .contact-form{

        padding:
            25px 15px;

    }


    .contact-form h2{

        font-size:23px;

    }


    .contact-form input,
    .contact-form textarea{

        font-size:14px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">


    <div class="logo">
        CakeHeaven 🍰
    </div>


    <!-- HAMBURGER BUTTON -->

    <button
        class="menu-btn"
        id="menuBtn"
        aria-label="Open navigation menu"
        aria-expanded="false">

        ☰

    </button>


    <!-- NAVIGATION -->

    <nav class="nav" id="navMenu">

        <a href="index.html">
            Home
        </a>

        <a href="cakemenu.html">
            Cakes
        </a>

        <a href="cakeabout.html">
            About
        </a>

        <a href="placeorder.html">
            Place Order
        </a>

        <a href="cakecontact.html">
            Contact
        </a>

    </nav>

</header>



<!-- =====================================================
     HERO
===================================================== -->

<section class="hero">

    <h1>
        Get in Touch
    </h1>

    <p>
        We'd love to hear your thoughts, orders, or questions!
    </p>

</section>



<!-- =====================================================
     CONTACT SECTION
===================================================== -->

<section class="contact-section">


    <!-- LEFT IMAGE -->

    <div class="contact-image"></div>



    <!-- RIGHT SIDE -->

    <div class="contact-details">


        <!-- ADDRESS -->

        <div class="info-card">

            <span>📍</span>

            <p>
                123 Sweet Street, Dessert City, CA
            </p>

        </div>



        <!-- PHONE -->

        <div class="info-card">

            <span>📞</span>

            <p>
                +1 234 567 890
            </p>

        </div>



        <!-- EMAIL -->

        <div class="info-card">

            <span>✉️</span>

            <p>
                hello@cakeheaven.com
            </p>

        </div>



        <!-- CONTACT FORM -->

        <div class="contact-form">


            <h2>
                Send a Message
            </h2>


            <form
                action="#"
                method="post">


                <input
                    type="text"
                    name="name"
                    placeholder="Your Name"
                    autocomplete="name"
                    required>


                <input
                    type="email"
                    name="email"
                    placeholder="Your Email"
                    autocomplete="email"
                    required>


                <input
                    type="text"
                    name="subject"
                    placeholder="Subject"
                    required>


                <textarea
                    name="message"
                    rows="6"
                    placeholder="Your Message"
                    required></textarea>


                <button
                    type="submit">

                    Send Message

                </button>


            </form>

        </div>


    </div>

</section>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    <p>
        © 2026 CakeHeaven | All Rights Reserved
    </p>

</footer>



<script>


/* =====================================================
   HAMBURGER MENU
===================================================== */


const menuBtn =
    document.getElementById("menuBtn");


const navMenu =
    document.getElementById("navMenu");


menuBtn.addEventListener(
    "click",
    function(){


        navMenu.classList.toggle("active");


        const isOpen =
            navMenu.classList.contains("active");


        menuBtn.setAttribute(
            "aria-expanded",
            isOpen
        );


        /* Change ☰ to ✕ */

        if(isOpen){

            menuBtn.innerHTML = "✕";

        }else{

            menuBtn.innerHTML = "☰";

        }

    }
);


/* =====================================================
   CLOSE MENU AFTER CLICKING LINK
===================================================== */


document
.querySelectorAll(".nav a")
.forEach(function(link){


    link.addEventListener(
        "click",
        function(){


            navMenu.classList.remove(
                "active"
            );


            menuBtn.innerHTML = "☰";


            menuBtn.setAttribute(
                "aria-expanded",
                "false"
            );


        }
    );

});


/* =====================================================
   RESET MOBILE MENU ON DESKTOP
===================================================== */


window.addEventListener(
    "resize",
    function(){


        if(window.innerWidth > 700){


            navMenu.classList.remove(
                "active"
            );


            menuBtn.innerHTML = "☰";


            menuBtn.setAttribute(
                "aria-expanded",
                "false"
            );


        }

    }
);

</script>


</body>

</html>
